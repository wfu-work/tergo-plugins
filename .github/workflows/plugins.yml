name: Validate and publish Tergo plugins

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tergo-plugin-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate plugins
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install shell runtimes
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Validate manifests and Shell syntax
        run: ./scripts/validate-plugin.sh
      - name: Run plugin smoke tests
        env:
          TERGO_SMOKE_PROJECT_ROOT: ${{ github.workspace }}
        run: ./scripts/smoke-test.sh
      - name: Validate generated catalog and package digests
        env:
          TERGO_PLUGIN_BASE_URL: https://wfu-work.github.io/tergo-plugins/packages
        run: |
          ./scripts/update-catalog.sh
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('.')
          catalog = json.loads((root / 'catalog/index.json').read_text())
          for plugin in catalog['plugins']:
              package = root / 'dist' / Path(plugin['packageUrl']).name
              digest = hashlib.sha256(package.read_bytes()).hexdigest()
              assert digest == plugin['sha256'], plugin['id']
              assert plugin['packageSize'] == package.stat().st_size, plugin['id']
          print('catalog validation passed')
          PY

  publish:
    name: Publish plugin site
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install shell runtimes
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Build static plugin site
        env:
          TERGO_PLUGIN_BASE_URL: https://wfu-work.github.io/tergo-plugins/packages
        run: ./scripts/build-site.sh
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.tergo-plugin --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.tergo-plugin --title "Tergo plugins $GITHUB_REF_NAME" --generate-notes
          fi
